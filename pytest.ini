[pytest]
# El paquete f1/ vive en la raiz del repo y no se instala. Sin esta linea,
# `pytest` a secas no lo encuentra: solo funciona `python -m pytest`, que
# agrega el directorio actual al sys.path por su cuenta.
#
# Esa diferencia hizo que los tests pasaran en local y fallaran en CI, que
# invoca `pytest tests/ -v`. Declarandolo aca, las dos formas funcionan igual.
pythonpath = .
testpaths = tests
