name: CI

# Antes decia `branches-ignore: master`. Como el trabajo se hace directo en
# master y sin pull requests, el resultado era que los tests no corrian nunca.
# Los commits automaticos del bot de ranking no disparan workflows (GitHub no
# reencadena workflows hechos con GITHUB_TOKEN), asi que no hace falta
# excluirlos a mano.
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Correr tests
        run: pytest tests/ -v
