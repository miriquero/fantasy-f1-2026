  workflow_dispatch:

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer votos desde Google Sheets
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python fetch_votos.py

      - name: Traer resultados desde Jolpica API
        id: fetch_resultados
        run: python fetch_resultados.py

      - name: Verificar si hay resultado nuevo
        id: check_resultado
        run: |
          if git diff --quiet resultados.json; then
            echo "hay_resultado_nuevo=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en resultados.json - la API todavia no tiene el dato."
          else
            echo "hay_resultado_nuevo=true" >> "$GITHUB_OUTPUT"
            echo "Resultado nuevo o corregido detectado."
          fi
          if [ -f "_penalidad_detectada.flag" ]; then
            echo "hay_penalidad=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_penalidad=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar ranking HTML
        if: steps.check_resultado.outputs.hay_resultado_nuevo == 'true'
        run: python fantasy_f1.py

      - name: Commit y push de cambios
        if: steps.check_resultado.outputs.hay_resultado_nuevo == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados.json respuestas/ ranking_f1.html
          git diff --cached --quiet || git commit -m "Auto: ranking actualizado post carrera"
          git push

      - name: Notificar correccion por penalidad
        if: steps.check_resultado.outputs.hay_penalidad == 'true'
        run: python notificar.py penalidad "https://miriquero.github.io/fantasy-f1-2026/ranking_f1.html"

      - name: Notificar exito por WhatsApp
        if: success() && steps.check_resultado.outputs.hay_resultado_nuevo == 'true' && steps.check_resultado.outputs.hay_penalidad == 'false'
        run: python notificar.py exito "https://miriquero.github.io/fantasy-f1-2026/ranking_f1.html"

      - name: Notificar error por WhatsApp
        if: failure()
        run: python notificar.py error "Revisa el log en GitHub Actions"