name: Post Carrera - Actualizar Ranking

on:
  schedule:
    - cron: '0 6 8 3 *'
    - cron: '0 9 15 3 *'
    - cron: '0 7 29 3 *'
    - cron: '0 22 3 5 *'
    - cron: '0 22 24 5 *'
    - cron: '0 15 7 6 *'
    - cron: '0 15 14 6 *'
    - cron: '0 15 28 6 *'
    - cron: '0 16 5 7 *'
    - cron: '0 15 19 7 *'
    - cron: '0 15 26 7 *'
    - cron: '0 15 23 8 *'
    - cron: '0 15 6 9 *'
    - cron: '0 15 13 9 *'
    - cron: '0 13 26 9 *'
    - cron: '0 14 11 10 *'
    - cron: '0 22 25 10 *'
    - cron: '0 22 1 11 *'
    - cron: '0 19 8 11 *'
    - cron: '0 6 22 11 *'
    - cron: '0 18 29 11 *'
    - cron: '0 15 6 12 *'
  workflow_dispatch:

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer votos desde Google Sheets
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python fetch_votos.py

      - name: Traer resultados desde Jolpica API
        run: python fetch_resultados.py

      - name: Generar ranking HTML
        run: python fantasy_f1.py

      - name: Commit y push de cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados.json respuestas/ ranking_f1.html index.html
          git diff --cached --quiet || git commit -m "Auto: ranking actualizado post carrera"
          git push