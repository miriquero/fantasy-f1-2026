name: Post Carrera - Actualizar Ranking

on:
  schedule:
    - cron: '0 9 8 3 *'
    - cron: '0 12 15 3 *'
    - cron: '0 10 29 3 *'
    - cron: '0 1 4 5 *'
    - cron: '0 1 25 5 *'
    - cron: '0 18 7 6 *'
    - cron: '0 18 14 6 *'
    - cron: '0 18 28 6 *'
    - cron: '0 19 5 7 *'
    - cron: '0 18 19 7 *'
    - cron: '0 18 26 7 *'
    - cron: '0 18 23 8 *'
    - cron: '0 18 6 9 *'
    - cron: '0 18 13 9 *'
    - cron: '0 16 26 9 *'
    - cron: '0 17 11 10 *'
    - cron: '0 1 26 10 *'
    - cron: '0 1 2 11 *'
    - cron: '0 22 8 11 *'
    - cron: '0 9 22 11 *'
    - cron: '0 21 29 11 *'
    - cron: '0 18 6 12 *'
  workflow_dispatch:

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer votos desde Google Sheets
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python fetch_votos.py

      - name: Traer resultados desde Jolpica API
        run: python fetch_resultados.py

      - name: Generar ranking HTML
        run: python fantasy_f1.py

      - name: Commit y push de cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados.json respuestas/ ranking_f1.html
          git diff --cached --quiet || git commit -m "Auto: ranking actualizado post carrera"
          git push

      - name: Notificar exito por WhatsApp
        if: success()
        run: python notificar.py exito "https://miriquero.github.io/fantasy-f1-2026/ranking_f1.html"

      - name: Notificar error por WhatsApp
        if: failure()
        run: python notificar.py error "Revisa el log en GitHub Actions"