name: Fantasy F1 - Actualización Domingos y Lunes

on:
  schedule:
    - cron: '0 13 * * 0,1'     # 13:00 UTC = 10:00 ARG (domingo y lunes)
    - cron: '0 22 * * 0,1'     # 22:00 UTC = 19:00 ARG (domingo y lunes)
  workflow_dispatch:         # Para ejecutar manualmente desde GitHub

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      # Mapa mail -> apodo. Si no esta cargado el workflow igual corre y no
      # publica ningun mail: muestra la parte de antes del @.
      PARTICIPANTES_JSON: ${{ secrets.PARTICIPANTES_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar votos desde Google Sheets
        run: python fetch_votos.py

      - name: Actualizar resultados desde Jolpica
        run: python fetch_resultados.py

      # Los dos scripts anteriores dejan un archivo en avisos/ cuando pasa algo
      # que la familia deberia saber. Si no pasa nada, no hay archivo y no se
      # manda ningun mensaje.
      - name: Avisar si la FIA corrigio un resultado
        run: |
          if [ -s avisos/penalidad.txt ]; then
            python notificar.py penalidad "$(cat avisos/penalidad.txt)"
          else
            echo "Sin correcciones."
          fi

      - name: Avisar si alguien voto tarde
        run: |
          if [ -s avisos/tardios.txt ]; then
            python notificar.py tardios "$(cat avisos/tardios.txt)"
          else
            echo "Sin votos tardios nuevos."
          fi

      - name: Generar ranking HTML
        run: python fantasy_f1.py

      - name: Commit y Push (si hay cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet resultados.json respuestas/ ranking_f1.html estado_avisos.json; then
            echo "No hay cambios nuevos."
          else
            git add resultados.json respuestas/ ranking_f1.html estado_avisos.json
            git commit -m "Auto: Actualización diaria del ranking - $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "Cambios subidos correctamente."
          fi

      - name: Notificar por WhatsApp (éxito)
        if: success()
        run: python notificar.py exito "https://miriquero.github.io/fantasy-f1-2026/ranking_f1.html"

      - name: Notificar error
        if: failure()
        run: python notificar.py error "La actualización automática falló. Revisar logs."