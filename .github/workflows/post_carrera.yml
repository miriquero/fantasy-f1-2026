name: Post Carrera - Actualizar Ranking

on:
  schedule:
    # Corre 2 horas después de cada carrera (hora UTC)
    # Australia    08-MAR  ARG 01:00 = UTC 04:00  -> +2h = 06:00 UTC
    - cron: '0 6 8 3 *'
    # China        15-MAR  ARG 04:00 = UTC 07:00  -> +2h = 09:00 UTC
    - cron: '0 9 15 3 *'
    # Japon        29-MAR  ARG 02:00 = UTC 05:00  -> +2h = 07:00 UTC
    - cron: '0 7 29 3 *'
    # Miami        03-MAY  ARG 17:00 = UTC 20:00  -> +2h = 22:00 UTC
    - cron: '0 22 3 5 *'
    # Canada       24-MAY  ARG 17:00 = UTC 20:00  -> +2h = 22:00 UTC
    - cron: '0 22 24 5 *'
    # Monaco       07-JUN  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 7 6 *'
    # Barcelona    14-JUN  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 14 6 *'
    # Austria      28-JUN  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 28 6 *'
    # Gran Bretana 05-JUL  ARG 11:00 = UTC 14:00  -> +2h = 16:00 UTC
    - cron: '0 16 5 7 *'
    # Belgica      19-JUL  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 19 7 *'
    # Hungria      26-JUL  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 26 7 *'
    # Paises Bajos 23-AGO  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 23 8 *'
    # Italia       06-SEP  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 6 9 *'
    # Madrid       13-SEP  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 13 9 *'
    # Azerbaiyn    26-SEP  ARG 08:00 = UTC 11:00  -> +2h = 13:00 UTC
    - cron: '0 13 26 9 *'
    # Singapur     11-OCT  ARG 09:00 = UTC 12:00  -> +2h = 14:00 UTC
    - cron: '0 14 11 10 *'
    # Austin       25-OCT  ARG 17:00 = UTC 20:00  -> +2h = 22:00 UTC
    - cron: '0 22 25 10 *'
    # Mexico       01-NOV  ARG 17:00 = UTC 20:00  -> +2h = 22:00 UTC
    - cron: '0 22 1 11 *'
    # Brasil       08-NOV  ARG 14:00 = UTC 17:00  -> +2h = 19:00 UTC
    - cron: '0 19 8 11 *'
    # Las Vegas    21-NOV  ARG 01:00 = UTC 04:00  -> +2h = 06:00 UTC (Dom 22)
    - cron: '0 6 22 11 *'
    # Qatar        29-NOV  ARG 13:00 = UTC 16:00  -> +2h = 18:00 UTC
    - cron: '0 18 29 11 *'
    # Abu Dhabi    06-DIC  ARG 10:00 = UTC 13:00  -> +2h = 15:00 UTC
    - cron: '0 15 6 12 *'

  # Permite correrlo a mano desde GitHub si hace falta
  workflow_dispatch:

jobs:
  actualizar-ranking:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Necesario para hacer push al repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Traer votos desde Google Sheets
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python fetch_votos.py

      - name: Traer resultados desde Jolpica API
        run: python fetch_resultados.py

      - name: Generar ranking HTML
        run: python fantasy_f1.py

      - name: Commit y push de cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados.json respuestas/ ranking_f1.html index.html
          git diff --cached --quiet || git commit -m "Auto: ranking actualizado post carrera"
          git push
